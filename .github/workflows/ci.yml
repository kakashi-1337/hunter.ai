# Runs what a contributor runs by hand before a pull request: the backend tests, and the
# frontend's type check, tests, lint and build. Nothing here needs a key, a model, Docker
# or the network beyond installing the packages.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-24.04         # the system these commands were checked on; ubuntu-latest has moved on to 26
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      # --locked: a change to pyproject.toml that the lock file does not carry fails here, not on someone's machine.
      - name: Install
        run: uv sync --locked
      - name: Tests
        run: uv run pytest -q

  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04         # the system these commands were checked on; ubuntu-latest has moved on to 26
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"      # the version the lock file was last checked with; raise it on purpose
      - name: Install
        run: bun install --frozen-lockfile
      - name: Types
        run: bunx tsc -b
      - name: Tests
        run: bunx vitest run
      - name: Lint
        run: bunx oxlint
      - name: Build
        run: bun run build
